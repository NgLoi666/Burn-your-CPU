name: LiquidNotes
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  LiquidNotes:
    type: application
    platform: iOS
    sources:
      - path: LiquidNotes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LiquidNotes/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LiquidNotes
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
